name: CI

# Pushes and pull requests: rebuild swimlane-editor.html and check that the
# committed file matches the source. A `v*` tag also drafts a GitHub release with
# the HTML file attached; the tag needs a matching section in CHANGELOG.md.
#
# Every action is pinned to a commit, its version as a comment: a tag that is moved
# can't bring other code into this workflow. Dependabot (.github/dependabot.yml)
# proposes updates once a month.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Read-only by default; only the release job may write (it drafts the release).
permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./build.sh
      - name: Committed build output is up to date
        run: |
          if ! git diff --quiet -- swimlane-editor.html; then
            echo "::error::swimlane-editor.html is out of date. Run ./build.sh and commit the result."
            exit 1
          fi
      - name: No network references in the app
        run: |
          # The app must stay offline: no URLs except the SVG namespace.
          if grep -o -E "https?://[^\"' )<>]+" src/app.html | grep -v -x 'http://www.w3.org/2000/svg'; then
            echo "::error::src/app.html references a network URL."
            exit 1
          fi

  workflows:
    name: Lint workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: actionlint
      - run: actionlint
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, workflows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write      # draft the release
      id-token: write      # sign the provenance attestation
      attestations: write  # store it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release notes from CHANGELOG.md
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          app=$(sed -n "s/^const APP_VERSION = '\([^']*\)'.*/\1/p" src/app.html)
          if [ "$app" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match APP_VERSION in src/app.html ($app)"
            exit 1
          fi
          awk -v v="$version" '
            /^## \[/ { if (found) exit; found = index($0, "## [" v "]") == 1; next }
            found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          cat >> notes.md <<'EOF'

          ### Download

          `swimlane-editor.html` – open it in Chrome or Edge. Nothing to install; it works offline.

          Built by this repository's CI: `gh attestation verify swimlane-editor.html --repo fly2nbc-oss/Swimlane-Editor` checks that.
          EOF
          mkdir release
          cp swimlane-editor.html release/
          (cd release && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/swimlane-editor.html
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag --title "Swimlane Editor $VERSION" --notes-file notes.md
