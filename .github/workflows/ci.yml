name: CI

# Pushes and pull requests: rebuild swimlane-editor.html and check that the
# committed file matches the source. A `v*` tag also drafts a GitHub release with
# the HTML file and a Windows installer ZIP attached; the tag needs a matching
# section in CHANGELOG.md.
#
# Every action is pinned to a commit, its version as a comment: a tag that is moved
# can't bring other code into this workflow. Dependabot (.github/dependabot.yml)
# proposes updates once a month.
on:
  push:
    branches: [main]
    tags: ["v*"]
    # Docs don't need a build, except the AI guide and its example: build.sh inlines them.
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "docs/AI-DIAGRAMS.md"
      - "docs/examples/leave-request-simple.json"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Read-only by default; only the release job may write (it drafts the release).
permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./build.sh
      - name: Committed build output is up to date
        run: |
          if ! git diff --quiet -- swimlane-editor.html; then
            echo "::error::swimlane-editor.html is out of date. Run ./build.sh and commit the result."
            exit 1
          fi
      - name: No network references in the app
        run: |
          # The app must stay offline: no URLs except the SVG namespace.
          if grep -o -E "https?://[^\"' )<>]+" src/app.html | grep -v -x 'http://www.w3.org/2000/svg'; then
            echo "::error::src/app.html references a network URL."
            exit 1
          fi

  workflows:
    name: Lint workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          file="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$file" "https://github.com/rhysd/actionlint/releases/download/v$VERSION/$file"
          echo "$SHA256  $RUNNER_TEMP/$file" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, workflows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write      # draft the release
      id-token: write      # sign the provenance attestation
      attestations: write  # store it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release notes from CHANGELOG.md
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          app=$(sed -n "s/^const APP_VERSION = '\([^']*\)'.*/\1/p" src/app.html)
          if [ "$app" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match APP_VERSION in src/app.html ($app)"
            exit 1
          fi
          awk -v v="$version" '
            /^## \[/ { if (found) exit; found = index($0, "## [" v "]") == 1; next }
            found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          cat >> notes.md <<'EOF'

          ### Download

          | File | For |
          |---|---|
          | `swimlane-editor.html` | Chrome or Edge: open it, nothing to install; works offline |
          | `swimlane-editor_@VERSION@_windows-installer.zip` | Windows: unpack, run `install.cmd`; adds *Swimlane Editor* to the Start menu for the current user, no admin rights |

          Built by this repository's CI: `gh attestation verify <file> --repo fly2nbc-oss/Swimlane-Editor` checks that.
          EOF
          sed -i "s/@VERSION@/$version/" notes.md
          mkdir release
          cp swimlane-editor.html release/
          # Windows installer: one folder with the batch scripts, the app and the notices.
          # .gitattributes checks the .cmd files out with CRLF, as cmd.exe needs.
          pkg="$RUNNER_TEMP/Swimlane Editor"
          mkdir -p "$pkg"
          cp packaging/windows/install.cmd packaging/windows/uninstall.cmd packaging/windows/swimlane-editor.ico \
             swimlane-editor.html LICENSE NOTICE THIRD_PARTY.md "$pkg/"
          (cd "$RUNNER_TEMP" && zip -X -r "$GITHUB_WORKSPACE/release/swimlane-editor_${version}_windows-installer.zip" "Swimlane Editor")
          (cd release && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag --title "Swimlane Editor $VERSION" --notes-file notes.md
